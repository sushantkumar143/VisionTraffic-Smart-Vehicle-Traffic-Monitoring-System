version: '3.8'

services:
  app:
    build: .
    container_name: vision-traffic-app
    ports:
      - "8501:8501"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=*sushant143*
      - MYSQL_DATABASE=vehicle_analytics_db
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: vision-traffic-db
    restart: always
    environment:
      MYSQL_DATABASE: vehicle_analytics_db
      MYSQL_ROOT_PASSWORD: *sushant143*
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
